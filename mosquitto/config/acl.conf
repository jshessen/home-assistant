# homeassistant — full access (manages all HA topics)
user homeassistant
topic readwrite #

# zigbee2mqtt — own namespace + homeassistant discovery namespace
user zigbee2mqtt
topic readwrite zigbee2mqtt/#
topic readwrite homeassistant/#

# rtl433 — publish sensor data only
user rtl433
topic write rtl_433/#
topic write homeassistant/sensor/#

# jshessen — admin/monitoring access (read all topics)
user jshessen
topic read #
