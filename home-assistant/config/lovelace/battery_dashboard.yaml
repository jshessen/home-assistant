# ============================================================================
# Battery Status Dashboard — v4 (Full Redesign)
# ============================================================================
# Comprehensive battery monitoring using Battery Notes v3.4.3 + custom cards.
# Dynamic entity discovery — no hard-coded entity IDs.
#
# Tabs:
#   1. Status  — battery-state-card hero + fleet summary + binary sensor alerts
#   2. Manage  — replacement history + never replaced + replace buttons
#
# Fix log (v4):
#   - Reduced from 4 tabs to 2 for clarity and usability
#   - Fixed collapse bug: all 3 tiers defined (Critical/Low/Good) so items bucket
#     correctly. One-group collapse caused ALL items to land in that group.
#   - Fixed fleet count Jinja2: (sensors | count) - (low | count) with parens
#     (operator precedence — bare `sensors | count - low | count` was wrong)
#   - Fixed Overview filter: state < 40 threshold replaces battery_low attr so
#     devices like 32% Garage Entry Lock (10% threshold) now show as "needing
#     attention" regardless of per-device Battery Notes threshold setting
#   - battery_last_replaced_days removed (not a real attribute in v3.4.3)
# ============================================================================

views:

  # ==========================================================================
  # VIEW 1: STATUS
  # Left: battery-state-card hero (3-tier collapse, group-by-level)
  # Right: fleet summary markdown + binary sensor alert cards
  # ==========================================================================
  - title: Status
    path: battery-status
    icon: mdi:battery-alert

    cards:

      # ---- Left column: battery-state-card with 3-tier collapse -------------
      # All 3 tiers defined so items bucket correctly by actual level.
      # Critical + Low expanded by default; Good collapsed to reduce noise.
      - type: vertical-stack
        cards:

          - type: custom:battery-state-card
            title: "🔋 Battery Fleet — Group by Level"
            sort_by_level: true
            secondary_info: "{attributes.battery_type_and_quantity}"
            filter:
              include:
                - name: entity_id
                  value: "*_battery_plus"
              exclude:
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
            collapse:
              - name: "🔴 Critical — Below 20%"
                from: 0
                to: 19
              - name: "🟡 Low — 20–39%"
                from: 20
                to: 39
              - name: "✅ Good — 40%+"
                from: 40
                to: 100
                default_hide: true
            bulk_rename:
              - from: " Battery+"
                to: ""

      # ---- Right column: fleet summary + binary sensor alerts ---------------
      - type: vertical-stack
        cards:

          # Fleet summary — fixed Jinja2 operator precedence with explicit parens
          - type: markdown
            content: >
              {% set sensors = states.binary_sensor
                | selectattr('entity_id', 'search', 'battery_plus_low')
                | list %}
              {% set low = sensors | selectattr('state', 'eq', 'on') | list %}
              📊 **Battery Fleet:** {{ sensors | count }} monitored
              · 🔴 **{{ low | count }}** low
              · ✅ **{{ (sensors | count) - (low | count) }}** normal

          # Devices Battery Notes considers actively low (binary sensor on)
          - type: custom:auto-entities
            card:
              type: entities
              title: "🔴 Devices Reporting Low"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: battery
                  state: "on"
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: name
            show_empty: false

          # Healthy devices — binary sensor off
          - type: custom:auto-entities
            card:
              type: entities
              title: "✅ Normal — All Good"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: battery
                  state: "off"
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: name
            show_empty: false

  # ==========================================================================
  # VIEW 2: MANAGE
  # Left: replacement history (oldest first) + never replaced
  # Right: replace buttons
  # ==========================================================================
  - title: Manage
    path: battery-manage
    icon: mdi:battery-sync

    cards:

      # ---- Left column: history + never replaced ----------------------------
      - type: vertical-stack
        cards:

          # Replacement history — oldest first so long-overdue devices surface at top.
          # format: relative converts ISO timestamp → "3 months ago".
          # ISO dates sort alphabetically = chronologically, so string sort works.
          - type: custom:auto-entities
            card:
              type: entities
              title: "🗓️ Replacement History (Oldest First)"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - entity_id: "*_battery_plus"
                  attributes:
                    battery_last_replaced: "*"
                  options:
                    type: custom:multiple-entity-row
                    secondary_info:
                      attribute: battery_type_and_quantity
                      name: Type
                    entities:
                      - attribute: battery_last_replaced
                        name: Replaced
                        format: relative
                      - attribute: battery_low_threshold
                        name: Threshold
                        unit: "%"
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: attribute
              attribute: battery_last_replaced
              numeric: false
              reverse: false
            show_empty: false

          # Devices with no replacement date — highest priority candidates
          - type: custom:auto-entities
            card:
              type: entities
              title: "❓ Never Replaced — No Date Recorded"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - entity_id: "*_battery_plus"
                  options:
                    type: custom:multiple-entity-row
                    secondary_info: last-updated
                    entities:
                      - attribute: battery_type_and_quantity
                        name: Type
                      - attribute: battery_low_threshold
                        name: Threshold
              exclude:
                - state: unavailable
                - state: unknown
                - attributes:
                    battery_last_replaced: "*"
            sort:
              method: state
              numeric: true
            show_empty: false

      # ---- Right column: replace buttons ------------------------------------
      - type: vertical-stack
        cards:

          - type: custom:auto-entities
            card:
              type: entities
              title: "🔋 Log Battery Replacement"
              show_header_toggle: false
            filter:
              include:
                - entity_id: "button.*_battery_replaced"
              exclude:
                - state: unavailable
            sort:
              method: name
            show_empty: false
