# ============================================================================
# Battery Status Dashboard — v15
# ============================================================================
# Views:
#   1. Monitor — Fleet summary + Needs Attention + All Batteries by Area
#              (Manage view removed — hold any battery row to log replacement)
#
# Changes in v10:
#   - Census view: Device-list cards now use battery-state-card with grouped-by
#     attribute display (battery_type, note). Brand/Model markdown summary card
#     removed (consolidated into battery-state-card). Visual treatment matches
#     Monitor view — battery level bars, colors, icons.
#   - battery-state-card grouping: group by attribute.battery_type and
#     attribute.note with collapse:false and secondary_info:"{count} devices".
#
# Changes in v9:
#   - Manage view removed. Hold (long-press) any battery row in either card to
#     call button.press on the corresponding *_battery_replaced button entity.
#     Entity ID is derived via KString:
#       sensor.*_battery_plus → button.*_battery_replaced
#   - YAML anchors: &battery-tap, &battery-hold added
#
# Changes in v8:
#   - FIX: Rechargeable devices (Sparky, Galaxy Watch, Patricia's phone) were
#     invisible because battery-state-card v4.2.2 processExcludes() runs over
#     ALL batteries (explicit AND filter-discovered) and entity_id filters have
#     is_permanent=true, causing permanent deletion from the batteries map.
#     Removed the entity_id excludes for the 3 devices — they are NOT needed:
#     processIncludes() already does `if(this.batteries[e]) return`, so explicit
#     entities are skipped on the include pass and no duplicates appear.
#   - charging_state.entity_id is still a static string (no KString support).
#   - YAML anchors: &rechargeable-entities (excl-* anchors removed)
#
# Changes in v7:
#   - Charging state indicators for rechargeable devices using per-entity
#     explicit listing. (entity_id exclusion was wrong — see v8 fix above.)
#   - YAML anchors: &rechargeable-entities / &rechargeable-excl-*
#
# Changes in v6:
#   - Fleet summary: float(100) precision + rejectattr _low guard (Basher)
#   - All Batteries / Needs Attention: exclude *_battery_plus_low entities
#   - All Batteries group secondary_info simplified to "{count} devices"
#   - Needs Attention colors: added 100% green step
# ============================================================================

views:

  # ==========================================================================
  # VIEW 1: MONITOR
  # type: sections uses HA's CSS grid — avoids horizontal-stack 50/50 splits
  # ==========================================================================
  - title: Monitor
    path: battery-monitor
    icon: mdi:battery-heart
    type: sections
    max_columns: 2

    sections:

      # ── LEFT section: Fleet summary + Needs Attention ──────────────────────
      - type: grid
        title: ""
        cards:

          - type: markdown
            content: |
              {% set ns = namespace(total=0, crit=0, low=0) %}
              {% for s in states.sensor
                  | selectattr('entity_id', 'search', '_battery_plus')
                  | rejectattr('entity_id', 'search', '_low')
                  | rejectattr('state', 'in', ['unavailable', 'unknown']) %}
                {%- set v = s.state | float(100) -%}
                {%- set ns.total = ns.total + 1 -%}
                {%- if v < 20 -%}{%- set ns.crit = ns.crit + 1 -%}
                {%- elif v < 40 -%}{%- set ns.low = ns.low + 1 -%}{%- endif -%}
              {% endfor %}
              📊 **Battery Fleet:** {{ ns.total }} monitored
              - 🔴 **{{ ns.crit }}** Critical (<20%)
              - 🟡 **{{ ns.low }}** Low (20–39%)
              - ✅ **{{ ns.total - ns.crit - ns.low }}** OK

          - type: custom:battery-state-card
            title: "⚠️ Needs Attention — Below 40%"
            default_config_base: false
            sort: &battery-sort
              - by: state
            tap_action: &battery-tap
              action: more-info
            # Hold (long-press) any row to log a battery replacement.
            # KString derives the button entity from the sensor entity:
            #   sensor.*_battery_plus → button.*_battery_replaced
            hold_action: &battery-hold
              action: call-service
              service: button.press
              target:
                entity_id: "{entity_id|replace(sensor.,button.)|replace(_battery_plus,_battery_replaced)}"
            # Rechargeable devices listed explicitly so charging_state.entity_id
            # (a static string — NOT KString) can reference each device's sensor.
            # No entity_id excludes needed: processIncludes() already skips
            # entities already present in the batteries map (from explicit listing).
            entities: &rechargeable-entities
              - entity: sensor.sparky_battery_plus
                # "attribute.icon" reads the entity's icon attribute set by Battery Notes
                # (e.g. mdi:battery-charging-wireless-70). charging_state.icon must NOT
                # be set — it would override this and prevent the attribute from being used.
                icon: "attribute.icon"
                # When charging: shows "⚡ Charging". When not charging: shows "Rechargeable · Hold to Replace 🔋"
                secondary_info: &rechargeable-secondary "{charging.text|equals(,Rechargeable · Hold to Replace 🔋)}"
                charging_state:
                  entity_id: sensor.sparky_battery_state
                  state: &samsung-charging-states
                    - "charging"
                    - "Charging"
                    - "full"
                    - "Full"
                  secondary_info_text: &charging-text "⚡ Charging"
              - entity: sensor.galaxy_watch_ultra_a61f_battery_plus
                icon: "attribute.icon"
                secondary_info: *rechargeable-secondary
                charging_state:
                  entity_id: sensor.galaxy_watch_ultra_a61f_battery_state
                  state: *samsung-charging-states
                  secondary_info_text: *charging-text
              - entity: sensor.patricia_s_phone_battery_plus
                icon: "attribute.icon"
                secondary_info: *rechargeable-secondary
                # No is_charging binary sensor — use companion-app battery_state sensor.
                # iOS Companion reports "Charging" / "Full" when plugged in.
                charging_state:
                  entity_id: sensor.patricia_s_phone_battery_state
                  state:
                    - "Charging"
                    - "Full"
                    - "charging"
                    - "full"
                  secondary_info_text: *charging-text
            filter:
              include: &battery-include
                - name: entity_id
                  value: "*_battery_plus*"
              exclude:
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
                - name: entity_id
                  value: "*_battery_plus_low*"
                - name: computed.state
                  operator: ">="
                  value: 40
            group:
              - name: "🔴 Critical — Below 20% ({count})"
                max: 19
                icon: mdi:battery-alert
              - name: "🟡 Low — 20–39% ({count})"
                min: 20
                max: 39
                icon: mdi:battery-low
            bulk_rename: &battery-bulk-rename
              - from: " Battery+"
                to: ""
            secondary_info: &battery-secondary-info "{attributes.battery_type_and_quantity} · {attributes.battery_last_replaced|reltime()} · Hold to Replace 🔋"
            colors: &battery-colors
              steps:
                - value: 20
                  color: "var(--label-badge-red)"
                - value: 39
                  color: "var(--label-badge-yellow)"
                - value: 100
                  color: "var(--label-badge-green)"
            style: &battery-style |
              battery-state-entity {
                padding-left: 16px;
                border-left: 2px solid var(--divider-color);
                margin-left: 8px;
              }

      # ── RIGHT section: All batteries grouped by area ────────────────────────
      - type: grid
        title: ""
        cards:

          - type: custom:battery-state-card
            title: "🏠 All Batteries — by Area"
            default_config_base: false
            sort: *battery-sort
            tap_action: *battery-tap
            hold_action: *battery-hold
            entities: *rechargeable-entities
            filter:
              include: *battery-include
              exclude:
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
                - name: entity_id
                  value: "*_battery_plus_low*"
            group:
              - by: "area.name"
                collapse: false
                icon: "{area.icon}"
                icon_color: "first"
                secondary_info: "{count} devices · {min}–{max}%"
            secondary_info: *battery-secondary-info
            bulk_rename: *battery-bulk-rename
            colors: *battery-colors
            style: *battery-style

  # ==========================================================================
  # VIEW 2: CENSUS
  # Fleet-wide statistics — battery type breakdown, brand analysis, lifespan
  # ==========================================================================
  - title: Census
    path: battery-census
    icon: mdi:chart-bar
    type: sections
    max_columns: 3

    sections:

      # ── Section 1: By Type ───────────────────────────────────────────────────
      - type: grid
        title: "🔋 By Type"
        cards:
          - type: custom:battery-state-card
            title: "🔋 Batteries by Type"
            sort: *battery-sort
            tap_action: *battery-tap
            hold_action: *battery-hold
            entities: *rechargeable-entities
            filter:
              include: *battery-include
              exclude:
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
                - name: entity_id
                  value: "*_battery_plus_low*"
            group:
              - by: "attributes.battery_type"
                collapse: false
                secondary_info: "{count} devices · {sum(attributes.battery_quantity)} units"
            secondary_info: *battery-secondary-info
            bulk_rename: *battery-bulk-rename
            colors: *battery-colors
            style: *battery-style

      # ── Section 2: By Brand/Model ─────────────────────────────────────────────
      - type: grid
        title: "🏷️ By Brand/Model"
        cards:
          - type: custom:battery-state-card
            title: "🏷️ Batteries by Brand/Model"
            sort: *battery-sort
            tap_action: *battery-tap
            hold_action: *battery-hold
            entities: *rechargeable-entities
            filter:
              include: *battery-include
              exclude:
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
                - name: entity_id
                  value: "*_battery_plus_low*"
            group:
              - by: "attributes.note"
                collapse: false
                secondary_info: "{count} devices · {sum(attributes.battery_quantity)} units"
              - name: "🔖 No Brand Data ({count})"
                collapse: false
                secondary_info: "{count} devices — add notes in Battery Notes"
                filter:
                  - or:
                      - name: "attributes.note"
                        operator: "not_exists"
                      - name: "attributes.note"
                        value: ""
            secondary_info: *battery-secondary-info
            bulk_rename: *battery-bulk-rename
            colors: *battery-colors
            style: *battery-style

      # ── Section 3: Lifespan Stats ─────────────────────────────────────────────
      - type: grid
        title: "📅 Lifespan Stats"
        cards:
          - type: custom:config-template-card
            entities:
              - sensor.sparky_battery_plus
              - sensor.galaxy_watch_ultra_a61f_battery_plus
              - sensor.patricia_s_phone_battery_plus
            card:
              type: vertical-stack
              cards: >-
                ${(function() {
                  var allBatteries = Object.values(states).filter(function(s) {
                    return s.entity_id.includes('_battery_plus') &&
                           !s.entity_id.includes('_battery_plus_low') &&
                           s.attributes && s.attributes.battery_type &&
                           s.state !== 'unavailable' && s.state !== 'unknown';
                  });
                  var btypes = Array.from(new Set(allBatteries.map(function(s) {
                    return s.attributes.battery_type;
                  }))).sort();
                  return btypes.flatMap(function(btype) {
                    var matching = allBatteries.filter(function(s) {
                      return s.attributes.battery_type === btype;
                    });
                    var withHistory = matching.filter(function(s) {
                      return s.attributes.battery_last_replaced;
                    });
                    var days = withHistory.map(function(s) {
                      var d = new Date(s.attributes.battery_last_replaced);
                      return Math.floor((Date.now() - d.getTime()) / 86400000);
                    });
                    var avgDays = days.length > 0
                      ? Math.round(days.reduce(function(a,b){return a+b;},0) / days.length)
                      : null;
                    var minDays = days.length > 0 ? Math.min.apply(null, days) : null;
                    var maxDays = days.length > 0 ? Math.max.apply(null, days) : null;
                    var statsLine = avgDays !== null
                      ? avgDays + ' days avg \u00b7 ' + minDays + '\u2013' + maxDays + ' days range \u00b7 ' + withHistory.length + ' with history'
                      : '_No replacement history yet_';
                    return [
                      {
                        type: 'markdown',
                        content: '### \ud83d\udcc5 ' + btype + '\n\n' +
                                 '**' + matching.length + ' device' + (matching.length !== 1 ? 's' : '') + '** \u00b7 ' + statsLine
                      },
                      {
                        type: 'custom:battery-state-card',
                        sort: [{ by: 'entity.attributes.battery_last_replaced', desc: false }],
                        tap_action: { action: 'more-info' },
                        hold_action: {
                          action: 'call-service',
                          service: 'button.press',
                          target: { entity_id: '{entity_id|replace(sensor.,button.)|replace(_battery_plus,_battery_replaced)}' }
                        },
                        filter: {
                          include: [
                            { name: 'entity_id', value: '*_battery_plus*' },
                            { name: 'attributes.battery_type', operator: '=', value: btype }
                          ],
                          exclude: [
                            { name: 'state', value: 'unavailable' },
                            { name: 'state', value: 'unknown' },
                            { name: 'entity_id', value: '*_battery_plus_low*' },
                            { name: 'attributes.battery_last_replaced', operator: 'not_exists' }
                          ]
                        },
                        collapse: 0,
                        secondary_info: '{attributes.battery_type_and_quantity} \u00b7 {attributes.battery_last_replaced|reltime()} \u00b7 Hold to Replace \ud83d\udd0b',
                        bulk_rename: [{ from: ' Battery+', to: '' }],
                        colors: {
                          steps: [
                            { value: 20, color: 'var(--label-badge-red)' },
                            { value: 39, color: 'var(--label-badge-yellow)' },
                            { value: 100, color: 'var(--label-badge-green)' }
                          ]
                        },
                        style: 'battery-state-entity { padding-left: 16px; border-left: 2px solid var(--divider-color); margin-left: 8px; }'
                      }
                    ];
                  });
                })()}
