# ============================================================================
# Battery Status Dashboard — v7
# ============================================================================
# Views:
#   1. Monitor — Fleet summary + All Batteries by Room + Needs Attention
#   2. Manage  — Replacement history (oldest first) + never replaced + buttons
#
# Changes in v7:
#   - Charging state indicators for rechargeable devices (Sparky, Galaxy Watch,
#     Patricia's phone) using per-entity explicit listing + filter exclusion.
#   - charging_state.entity_id does NOT support KString templating — must be
#     a static string. Rechargeable devices are explicitly listed with their
#     corresponding is_charging / battery_state sensors, then excluded from the
#     filter to prevent duplicates.
#   - YAML anchors: &rechargeable-entities / &rechargeable-excl-*
#
# Changes in v6:
#   - Fleet summary: float(100) precision + rejectattr _low guard (Basher)
#   - All Batteries / Needs Attention: exclude *_battery_plus_low entities
#   - All Batteries group secondary_info simplified to "{count} devices"
#   - Needs Attention colors: added 100% green step
# ============================================================================

views:

  # ==========================================================================
  # VIEW 1: MONITOR
  # type: sections uses HA's CSS grid — avoids horizontal-stack 50/50 splits
  # ==========================================================================
  - title: Monitor
    path: battery-monitor
    icon: mdi:battery-heart
    type: sections
    max_columns: 2

    sections:

      # ── LEFT section: Fleet summary + Needs Attention ──────────────────────
      - type: grid
        title: ""
        cards:

          - type: markdown
            content: |
              {% set ns = namespace(total=0, crit=0, low=0) %}
              {% for s in states.sensor
                  | selectattr('entity_id', 'search', '_battery_plus')
                  | rejectattr('entity_id', 'search', '_low')
                  | rejectattr('state', 'in', ['unavailable', 'unknown']) %}
                {%- set v = s.state | float(100) -%}
                {%- set ns.total = ns.total + 1 -%}
                {%- if v < 20 -%}{%- set ns.crit = ns.crit + 1 -%}
                {%- elif v < 40 -%}{%- set ns.low = ns.low + 1 -%}{%- endif -%}
              {% endfor %}
              📊 **Battery Fleet:** {{ ns.total }} monitored
              - 🔴 **{{ ns.crit }}** Critical (<20%)
              - 🟡 **{{ ns.low }}** Low (20–39%)
              - ✅ **{{ ns.total - ns.crit - ns.low }}** OK

          - type: custom:battery-state-card
            title: "⚠️ Needs Attention — Below 40%"
            default_config_base: false
            sort: &battery-sort
              - by: state
            # Rechargeable devices listed explicitly so charging_state.entity_id
            # (a static string — NOT KString) can reference each device's sensor.
            # They are also excluded from the filter below to prevent duplicates.
            entities: &rechargeable-entities
              - entity: sensor.sparky_battery_plus
                charging_state:
                  entity_id: binary_sensor.sparky_is_charging
                  state: "on"
                  icon: mdi:lightning-bolt
              - entity: sensor.galaxy_watch_ultra_a61f_battery_plus
                charging_state:
                  entity_id: binary_sensor.galaxy_watch_ultra_a61f_is_charging
                  state: "on"
                  icon: mdi:lightning-bolt
              - entity: sensor.patricia_s_phone_battery_plus
                # No is_charging binary sensor — use companion-app battery_state sensor.
                # iOS Companion reports "Charging" / "Full" when plugged in.
                charging_state:
                  entity_id: sensor.patricia_s_phone_battery_state
                  state:
                    - "Charging"
                    - "Full"
                    - "charging"
                    - "full"
                  icon: mdi:lightning-bolt
            filter:
              include: &battery-include
                - name: entity_id
                  value: "*_battery_plus*"
              exclude:
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
                - name: entity_id
                  value: "*_battery_plus_low*"
                - name: computed.state
                  operator: ">="
                  value: 40
                # Exclude rechargeable devices from filter — they are in `entities` above.
                - &rechargeable-excl-sparky
                  name: entity_id
                  value: "sensor.sparky_battery_plus"
                - &rechargeable-excl-watch
                  name: entity_id
                  value: "sensor.galaxy_watch_ultra_a61f_battery_plus"
                - &rechargeable-excl-patricia
                  name: entity_id
                  value: "sensor.patricia_s_phone_battery_plus"
            group:
              - name: "🔴 Critical — Below 20% ({count})"
                max: 19
                icon: mdi:battery-alert
              - name: "🟡 Low — 20–39% ({count})"
                min: 20
                max: 39
                icon: mdi:battery-low
            bulk_rename: &battery-bulk-rename
              - from: " Battery+"
                to: ""
            secondary_info: &battery-secondary-info "{attributes.battery_type_and_quantity} · {attributes.battery_last_replaced|reltime()}"
            colors: &battery-colors
              steps:
                - value: 20
                  color: "var(--label-badge-red)"
                - value: 39
                  color: "var(--label-badge-yellow)"
                - value: 100
                  color: "var(--label-badge-green)"
            style: &battery-style |
              battery-state-entity {
                padding-left: 16px;
                border-left: 2px solid var(--divider-color);
                margin-left: 8px;
              }

      # ── RIGHT section: All batteries grouped by area ────────────────────────
      - type: grid
        title: ""
        cards:

          - type: custom:battery-state-card
            title: "🏠 All Batteries — by Area"
            default_config_base: false
            sort: *battery-sort
            entities: *rechargeable-entities
            filter:
              include: *battery-include
              exclude:
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
                - name: entity_id
                  value: "*_battery_plus_low*"
                # Exclude rechargeable devices from filter — they are in `entities` above.
                - *rechargeable-excl-sparky
                - *rechargeable-excl-watch
                - *rechargeable-excl-patricia
            group:
              - by: "area.name"
                collapse: false
                icon: "{area.icon}"
                icon_color: "first"
                secondary_info: "{count} devices · {min}–{max}%"
            secondary_info: *battery-secondary-info
            bulk_rename: *battery-bulk-rename
            colors: *battery-colors
            style: *battery-style

  # ==========================================================================
  # VIEW 2: MANAGE
  # Replacement history (oldest first) + never replaced + log buttons
  # ==========================================================================
  - title: Manage
    path: battery-manage
    icon: mdi:battery-sync

    cards:

      # Replacement history — oldest first so long-overdue devices surface first.
      # format: relative converts ISO timestamp → "3 months ago".
      # ISO dates sort alphabetically = chronologically, so string sort works.
      - type: custom:auto-entities
        card:
          type: entities
          title: "🗓️ Replacement History (Oldest First)"
          show_header_toggle: false
          state_color: true
        filter:
          include:
            - entity_id: "*_battery_plus"
              attributes:
                battery_last_replaced: "*"
              options:
                type: custom:multiple-entity-row
                secondary_info:
                  attribute: battery_type_and_quantity
                  name: Type
                entities:
                  - attribute: battery_last_replaced
                    name: Replaced
                    format: relative
                  - attribute: battery_low_threshold
                    name: Threshold
                    unit: "%"
          exclude:
            - state: unavailable
            - state: unknown
        sort:
          method: attribute
          attribute: battery_last_replaced
          numeric: false
          reverse: false
        show_empty: false

      # Devices with no replacement date — highest priority candidates
      - type: custom:auto-entities
        card:
          type: entities
          title: "❓ Never Replaced — No Date Recorded"
          show_header_toggle: false
          state_color: true
        filter:
          include:
            - entity_id: "*_battery_plus"
              options:
                type: custom:multiple-entity-row
                secondary_info: last-updated
                entities:
                  - attribute: battery_type_and_quantity
                    name: Type
                  - attribute: battery_low_threshold
                    name: Threshold
          exclude:
            - state: unavailable
            - state: unknown
            - attributes:
                battery_last_replaced: "*"
        sort:
          method: state
          numeric: true
        show_empty: false

      # Log replacement buttons — sorted alphabetically
      - type: custom:auto-entities
        card:
          type: entities
          title: "🔋 Log Battery Replacement"
          show_header_toggle: false
        filter:
          include:
            - entity_id: "button.*_battery_replaced"
          exclude:
            - state: unavailable
        sort:
          method: name
        show_empty: false
