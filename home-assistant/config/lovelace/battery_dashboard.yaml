# ============================================================================
# Battery Status Dashboard — Full Redesign (4-tab layout)
# ============================================================================
# Comprehensive battery monitoring using all Battery Notes v3.4.3 features.
# Dynamic entity discovery via *_battery_plus naming convention (35 devices).
#
# Tabs:
#   1. Overview     (battery-overview)     — Critical/Low tier card + binary alerts
#   2. All Devices  (battery-all)          — Complete fleet, tiered collapse
#   3. Maintenance  (battery-maintenance)  — Never replaced + replace button log
#   4. Details      (battery-details)      — Rich per-device inline data table
#
# Custom cards required (installed in www/community/):
#   - battery-state-card     (maxwroc)     — tier collapse, secondary_info, bulk_rename
#   - lovelace-fold-entity-row             — collapsable section rows
#   - lovelace-auto-entities               — dynamic entity population + filtering
#   - lovelace-multiple-entity-row         — inline multi-attribute display
#   - lovelace-card-tools                  — utility extensions
#
# Battery Notes entity patterns per device:
#   sensor.{device}_battery_plus           — Primary numeric % entity (key attrs below)
#   binary_sensor.{device}_battery_plus_low — Threshold-based low alert (on = low)
#   button.{device}_battery_replaced       — Tap to log a replacement event
#
# Key attributes on sensor.*_battery_plus:
#   battery_type_and_quantity    — e.g. "4×AA"
#   battery_low_threshold        — configured threshold %
#   battery_low                  — bool
#   battery_last_replaced        — ISO date string
#   battery_last_replaced_days   — integer days since replacement (null if never)
#   battery_last_reported        — datetime of last reading
#   device_name                  — friendly name
# ============================================================================

views:

  # ==========================================================================
  # VIEW 1: OVERVIEW
  # Quick-glance status: critical/low tier card (left) + binary alerts (right)
  # ==========================================================================
  - title: Overview
    path: battery-overview
    icon: mdi:battery-alert
    cards:

      # ---- Left column: Critical & Low battery-state-card -------------------
      - type: vertical-stack
        cards:

          # Filters to <40% devices only; splits into Critical and Low tiers.
          # Both tiers start expanded — these all require attention.
          # secondary_info: battery type + days since last replacement.
          #   (null battery_last_replaced_days renders as "nulld" — see Maintenance tab)
          # bulk_rename strips " Battery+" for readable names.
          - type: custom:battery-state-card
            title: "🚨 Critical & Low Batteries"
            sort_by_level: true
            secondary_info: "{attributes.battery_type_and_quantity} · {attributes.battery_last_replaced_days}d"
            filter:
              include:
                - name: entity_id
                  value: "*_battery_plus"
              exclude:
                - name: state
                  operator: ">="
                  value: "40"
                - name: state
                  value: "unavailable"
                - name: state
                  value: "unknown"
            collapse:
              - name: "🔴 Critical — Below 20%"
                from: 0
                to: 19
              - name: "🟡 Low — 20–40%"
                from: 20
                to: 39
            bulk_rename:
              - from: " Battery+"
                to: ""

      # ---- Right column: Binary sensor low/normal alerts --------------------
      - type: vertical-stack
        cards:

          # Two collapsable fold-entity-row sections driven by auto-entities.
          # Low (state: on) starts expanded — immediate action needed.
          # Normal (state: off) starts collapsed — healthy, reduce visual noise.
          - type: entities
            title: "⚠️ Battery Low Alerts"
            show_header_toggle: false
            state_color: true
            entities:

              # Low section — open by default for immediate visibility
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: "🔴 Low — Action Required"
                open: true
                padding: 0
                entities:
                  - type: custom:auto-entities
                    filter:
                      include:
                        - domain: binary_sensor
                          attributes:
                            device_class: battery
                          state: "on"
                      exclude:
                        - state: unavailable
                        - state: unknown
                    sort:
                      method: name
                    show_empty: true
                    card:
                      type: custom:fold-entity-row
                      padding: 0

              # Normal section — collapsed by default
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: "✅ Normal — All Good"
                open: false
                padding: 0
                entities:
                  - type: custom:auto-entities
                    filter:
                      include:
                        - domain: binary_sensor
                          attributes:
                            device_class: battery
                          state: "off"
                      exclude:
                        - state: unavailable
                        - state: unknown
                    sort:
                      method: name
                    show_empty: true
                    card:
                      type: custom:fold-entity-row
                      padding: 0

  # ==========================================================================
  # VIEW 2: ALL DEVICES
  # Single full-width card — complete fleet sorted by level with tier collapse
  # ==========================================================================
  - title: All Devices
    path: battery-all
    icon: mdi:battery-check
    cards:

      # Complete fleet sorted lowest-first.
      # Critical (<20%) and Low (20–40%) tiers start expanded — need attention.
      # Good (40%+) tier starts collapsed — healthy devices, expand to audit.
      # secondary_info: battery type + days since last replacement.
      # bulk_rename strips " Battery+" suffix for clean display names.
      - type: custom:battery-state-card
        title: "📋 All Battery Devices — Sorted by Level"
        sort_by_level: true
        secondary_info: "{attributes.battery_type_and_quantity} · {attributes.battery_last_replaced_days}d"
        filter:
          include:
            - name: entity_id
              value: "*_battery_plus"
          exclude:
            - name: state
              value: "unavailable"
            - name: state
              value: "unknown"
        collapse:
          - name: "🔴 Critical — Below 20%"
            from: 0
            to: 19
          - name: "🟡 Low — 20–40%"
            from: 20
            to: 39
          - name: "✅ Good — 40%+"
            from: 40
            to: 100
            default_hide: true
        bulk_rename:
          - from: " Battery+"
            to: ""

  # ==========================================================================
  # VIEW 3: MAINTENANCE
  # Two-column: never-replaced devices (left) + replace button log (right)
  # ==========================================================================
  - title: Maintenance
    path: battery-maintenance
    icon: mdi:battery-sync
    cards:

      # ---- Left column: Devices with no replacement date recorded -----------
      - type: vertical-stack
        cards:

          # Entities where battery_last_replaced is absent (never logged).
          # Sorted by level ascending — lowest first for prioritization.
          # multiple-entity-row shows battery type + threshold inline.
          # Open Battery Notes UI to log initial replacement dates for these.
          - type: custom:auto-entities
            card:
              type: entities
              title: "❓ Never Replaced — No Date Recorded"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - entity_id: "*_battery_plus"
                  options:
                    type: custom:multiple-entity-row
                    secondary_info: last-updated
                    entities:
                      - attribute: battery_type_and_quantity
                        name: Type
                      - attribute: battery_low_threshold
                        name: Threshold
              exclude:
                - state: unavailable
                - state: unknown
                - attributes:
                    battery_last_replaced: "*"
            sort:
              method: state
              numeric: true
            show_empty: false

      # ---- Right column: Replace button access + recent history -------------
      - type: vertical-stack
        cards:

          # button.{device}_battery_replaced — tap after physically swapping batteries
          # to record the event in Battery Notes and reset the days counter.
          - type: custom:auto-entities
            card:
              type: entities
              title: "🔋 Log Battery Replacement"
              show_header_toggle: false
            filter:
              include:
                - entity_id: "button.*_battery_replaced"
              exclude:
                - state: unavailable
            sort:
              method: name
            show_empty: false

          # Replacement history sorted by recency — devices replaced longest ago
          # appear at the top (largest battery_last_replaced_days value).
          # Only shows devices that have a recorded replacement date.
          - type: custom:auto-entities
            card:
              type: entities
              title: "🗓️ Replacement History (Oldest First)"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - entity_id: "*_battery_plus"
                  attributes:
                    battery_last_replaced: "*"
                  options:
                    type: custom:multiple-entity-row
                    secondary_info:
                      attribute: battery_last_replaced
                      name: Replaced
                    entities:
                      - attribute: battery_last_replaced_days
                        name: Days Ago
                        unit: d
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: attribute
              attribute: battery_last_replaced_days
              numeric: true
              reverse: true
            show_empty: false

  # ==========================================================================
  # VIEW 4: DETAILS
  # Full per-device inline data — level, type, threshold, days since replaced
  # ==========================================================================
  - title: Details
    path: battery-details
    icon: mdi:battery-clock
    cards:

      # Rich inline detail table using multiple-entity-row.
      # Each row: device name + % level (state), battery type (secondary_info),
      #           days since replaced, and configured low threshold.
      # Sorted by state (% level) ascending — lowest batteries surface first.
      - type: custom:auto-entities
        card:
          type: entities
          title: "🔍 Battery Details — All Devices"
          show_header_toggle: false
          state_color: true
        filter:
          include:
            - entity_id: "*_battery_plus"
              options:
                type: custom:multiple-entity-row
                secondary_info:
                  attribute: battery_type_and_quantity
                  name: Type
                entities:
                  - attribute: battery_last_replaced_days
                    name: Days
                    unit: d
                  - attribute: battery_low_threshold
                    name: Threshold
                    unit: "%"
          exclude:
            - state: unavailable
            - state: unknown
        sort:
          method: state
          numeric: true
        show_empty: false
