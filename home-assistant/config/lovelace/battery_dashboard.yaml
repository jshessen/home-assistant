# ============================================================================
# Battery Status Dashboard
# ============================================================================
# Consolidated single-view showing battery level, type, and days since replaced
# for all Battery Notes tracked devices (*_battery_plus). Sorted lowest first.
#
# Layout: Two-column visual structure using vertical-stack cards:
#   LEFT COLUMN (% View):
#     1. Critical & Low — battery-state-card filtered to <40%, split by tier
#     2. All Devices — battery-state-card full fleet, Good tier collapsed
#   RIGHT COLUMN (Alerts View):
#     3. Binary Alerts — collapsable sections for Low/Normal binary sensors
#     4. Never Replaced — auto-entities filtering for missing battery_last_replaced
#
# Tap any battery-state-card row → HA more-info popup (Battery Notes attributes).
#
# Requires:
#   - battery-state-card (HACS, maxwroc) — installed at www/community/battery-state-card/
#   - fold-entity-row (HACS) — installed at www/community/lovelace-fold-entity-row/
#   - auto-entities (HACS) — already installed
#   - battery_notes (custom_component) — already installed v3.4.3
#   - multiple-entity-row (HACS) — already installed
# ============================================================================

views:
  - title: Battery Monitor
    path: battery
    icon: mdi:battery-alert
    cards:

      # ========================================================================
      # LEFT COLUMN: % View — battery-state-card showing Battery Notes entities
      # ========================================================================
      - type: vertical-stack
        cards:

          # ---- Critical & Low — battery-state-card ----------------------------
          # Targets only Battery Notes entities (*_battery_plus), filtered to state < 40.
          # Uses collapse to split Critical (<20%) and Low (20–40%) into labeled sections.
          # secondary_info shows battery type + days since last replacement on each row.
          # Note: if battery_last_replaced_days is null (never replaced), it renders "nulld" —
          #   those devices are also surfaced in the "Never Replaced" card below.
          # bulk_rename strips " Battery+" suffix: "Living Room Battery+" → "Living Room".
          - type: custom:battery-state-card
            title: "🚨 Critical & Low"
            sort_by_level: true
            secondary_info: "{attributes.battery_type_and_quantity} · {attributes.battery_last_replaced_days}d"
            filter:
              include:
                - name: entity_id
                  value: "*_battery_plus"
              exclude:
                - name: state
                  operator: ">="
                  value: "40"
                - name: state
                  value: "unavailable"
                - name: state
                  value: "unknown"
            collapse:
              - name: "🔴 Critical — Below 20%"
                from: 0
                to: 19
              - name: "🟡 Low — 20–40%"
                from: 20
                to: 39
            bulk_rename:
              - from: " Battery+"
                to: ""

          # ---- All Devices — battery-state-card --------------------------------
          # Full fleet sorted lowest first. Good tier (≥40%) is collapsed by default
          # so the page stays scannable — expand to review healthy devices.
          # secondary_info shows battery type + days since last replacement on each row.
          - type: custom:battery-state-card
            title: "📋 All Devices"
            sort_by_level: true
            secondary_info: "{attributes.battery_type_and_quantity} · {attributes.battery_last_replaced_days}d"
            filter:
              include:
                - name: entity_id
                  value: "*_battery_plus"
              exclude:
                - name: state
                  value: "unavailable"
                - name: state
                  value: "unknown"
            collapse:
              - name: "✅ Good — 40%+"
                from: 40
                default_hide: true
            bulk_rename:
              - from: " Battery+"
                to: ""

      # ========================================================================
      # RIGHT COLUMN: Alerts View — Binary sensors + Never Replaced tracking
      # ========================================================================
      - type: vertical-stack
        cards:

          # ---- Battery Low Alerts (collapsable sections) ---------------------
          # battery-state-card only handles numeric sensors; binary_sensor entities
          # with device_class: battery are surfaced here instead.
          # Uses fold-entity-row for collapsable Low/Normal sections.
          # auto-entities dynamically populates each fold with matching binary sensors.
          - type: entities
            title: "⚠️ Battery Low Alerts"
            show_header_toggle: false
            state_color: true
            entities:

              # Section 1: Low (state: on) — Start expanded by default
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: "🔴 Low"
                open: true
                padding: 0
                entities:
                  - type: custom:auto-entities
                    filter:
                      include:
                        - domain: binary_sensor
                          attributes:
                            device_class: battery
                          state: "on"
                      exclude:
                        - state: unavailable
                        - state: unknown
                    sort:
                      method: name
                    show_empty: true
                    card:
                      type: custom:fold-entity-row
                      padding: 0

              # Section 2: Normal (state: off) — Start collapsed by default
              - type: custom:fold-entity-row
                head:
                  type: section
                  label: "✅ Normal"
                open: false
                padding: 0
                entities:
                  - type: custom:auto-entities
                    filter:
                      include:
                        - domain: binary_sensor
                          attributes:
                            device_class: battery
                          state: "off"
                      exclude:
                        - state: unavailable
                        - state: unknown
                    sort:
                      method: name
                    show_empty: true
                    card:
                      type: custom:fold-entity-row
                      padding: 0

          # ---- Devices Never Replaced (no recorded replacement) ----------------
          # Filters Battery Notes entities that have no battery_last_replaced attribute.
          # Useful prompt to open Battery Notes and log the initial replacement date.
          # multiple-entity-row shows type + current level inline.
          - type: custom:auto-entities
            card:
              type: entities
              title: "❓ No Replacement Date Recorded"
              state_color: true
              show_header_toggle: false
            filter:
              include:
                - entity_id: "*_battery_plus"
                  options:
                    type: custom:multiple-entity-row
                    secondary_info: last-updated
                    entities:
                      - attribute: battery_type_and_quantity
                        name: Type
                      - attribute: battery_level
                        name: Level
              exclude:
                - state: unavailable
                - state: unknown
                - attributes:
                    battery_last_replaced: "*"
            sort:
              method: state
              numeric: true
            show_empty: false
