# ============================================================================
# Battery Status Dashboard — v3 (Fixed)
# ============================================================================
# Comprehensive battery monitoring using Battery Notes v3.4.3 + custom cards.
# Dynamic entity discovery — no hard-coded entity IDs.
#
# Tabs:
#   1. Overview     — Attention-needed batteries (filter by battery_low attribute)
#   2. All Devices  — Full fleet sorted by level (Good tier collapsed)
#   3. Maintenance  — Never replaced + replace button log + history
#   4. Details      — Rich per-device data table with replacement dates
#
# Fix log (v3):
#   - battery_last_replaced_days removed (not a real attribute in v3.4.3);
#     using battery_last_replaced with format: relative in multiple-entity-row
#   - Overview filter changed to community-recommended battery_low attribute approach
#     (not state threshold — prevents blank left column)
#   - Binary sensor alerts section: removed broken fold+auto-entities nesting;
#     now uses two plain auto-entities cards stacked vertically
#   - All Devices: collapse reduced to ONE group (Good 40%+, hidden);
#     items below 40% show sorted/ungrouped above it
#   - secondary_info simplified to type only (no days) per community example
# ============================================================================

views:

  # ==========================================================================
  # VIEW 1: OVERVIEW
  # Left: battery-state-card showing ONLY low batteries (community pattern)
  # Right: binary sensor alert cards + fleet summary
  # ==========================================================================
  - title: Overview
    path: battery-overview
    icon: mdi:battery-alert
    cards:

      # ---- Left column: Low-only battery-state-card -------------------------
      # Uses battery_low attribute filter (community-recommended approach).
      # Shows only devices Battery Notes considers "low" per their threshold.
      # Empty card = nothing low = good news.
      - type: vertical-stack
        cards:

          - type: custom:battery-state-card
            title: "🚨 Batteries Requiring Attention"
            sort_by_level: true
            secondary_info: "{attributes.battery_type_and_quantity}"
            filter:
              include:
                - name: entity_id
                  value: "*_battery_plus"
              exclude:
                - name: attributes.battery_low
                  value: false
                - name: state
                  value: unavailable
                - name: state
                  value: unknown
            bulk_rename:
              - from: " Battery+"
                to: ""

      # ---- Right column: Binary alerts + fleet summary ----------------------
      - type: vertical-stack
        cards:

          # Fleet summary — Jinja2 template counts monitored vs low devices
          - type: markdown
            content: >
              {% set sensors = states.binary_sensor
                | selectattr('entity_id', 'search', 'battery_plus_low')
                | list %}
              {% set low = sensors | selectattr('state', 'eq', 'on') | list %}
              📊 **Battery Fleet:** {{ sensors | count }} monitored
              · 🔴 **{{ low | count }}** low
              · ✅ **{{ sensors | count - low | count }}** normal

          # Low battery binary sensors — devices actively reporting low
          - type: custom:auto-entities
            card:
              type: entities
              title: "🔴 Devices Reporting Low"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: battery
                  state: "on"
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: name
            show_empty: false

          # Normal binary sensors — healthy devices; collapsed for visual clarity
          - type: custom:auto-entities
            card:
              type: entities
              title: "✅ Normal — All Good"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: battery
                  state: "off"
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: name
            show_empty: false

  # ==========================================================================
  # VIEW 2: ALL DEVICES
  # Full fleet sorted lowest-first. Good tier (40%+) collapses to reduce noise.
  # Items below 40% show ungrouped and sorted — no Critical/Low tier confusion.
  # ==========================================================================
  - title: All Devices
    path: battery-all
    icon: mdi:battery-check
    cards:

      - type: custom:battery-state-card
        title: "📋 All Battery Devices — Sorted by Level"
        sort_by_level: true
        secondary_info: "{attributes.battery_type_and_quantity}"
        filter:
          include:
            - name: entity_id
              value: "*_battery_plus"
          exclude:
            - name: state
              value: unavailable
            - name: state
              value: unknown
        collapse:
          - name: "✅ Good — 40%+"
            from: 40
            to: 100
            default_hide: true
        bulk_rename:
          - from: " Battery+"
            to: ""

  # ==========================================================================
  # VIEW 3: MAINTENANCE
  # Left: never-replaced devices  |  Right: replace buttons + history
  # ==========================================================================
  - title: Maintenance
    path: battery-maintenance
    icon: mdi:battery-sync
    cards:

      # ---- Left column: Devices with no replacement date recorded -----------
      - type: vertical-stack
        cards:

          - type: custom:auto-entities
            card:
              type: entities
              title: "❓ Never Replaced — No Date Recorded"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - entity_id: "*_battery_plus"
                  options:
                    type: custom:multiple-entity-row
                    secondary_info: last-updated
                    entities:
                      - attribute: battery_type_and_quantity
                        name: Type
                      - attribute: battery_low_threshold
                        name: Threshold
              exclude:
                - state: unavailable
                - state: unknown
                - attributes:
                    battery_last_replaced: "*"
            sort:
              method: state
              numeric: true
            show_empty: false

      # ---- Right column: Replace button access + history --------------------
      - type: vertical-stack
        cards:

          - type: custom:auto-entities
            card:
              type: entities
              title: "🔋 Log Battery Replacement"
              show_header_toggle: false
            filter:
              include:
                - entity_id: "button.*_battery_replaced"
              exclude:
                - state: unavailable
            sort:
              method: name
            show_empty: false

          # History sorted by replacement date ascending (oldest first).
          # format: relative converts ISO timestamp → "3 months ago".
          # Sorted by battery_last_replaced string (ISO is alphabetically sortable).
          - type: custom:auto-entities
            card:
              type: entities
              title: "🗓️ Replacement History (Oldest First)"
              show_header_toggle: false
              state_color: true
            filter:
              include:
                - entity_id: "*_battery_plus"
                  attributes:
                    battery_last_replaced: "*"
                  options:
                    type: custom:multiple-entity-row
                    secondary_info:
                      attribute: battery_last_replaced
                      name: Replaced
                      format: relative
                    entities:
                      - attribute: battery_type_and_quantity
                        name: Type
                      - attribute: battery_low_threshold
                        name: Threshold
                        unit: "%"
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: attribute
              attribute: battery_last_replaced
              numeric: false
              reverse: false
            show_empty: false

  # ==========================================================================
  # VIEW 4: DETAILS
  # Rich per-device inline data — level, type, threshold, replaced date
  # format: relative on battery_last_replaced converts ISO → "3 months ago"
  # ==========================================================================
  - title: Details
    path: battery-details
    icon: mdi:battery-clock
    cards:

      - type: custom:auto-entities
        card:
          type: entities
          title: "🔍 Battery Details — All Devices"
          show_header_toggle: false
          state_color: true
        filter:
          include:
            - entity_id: "*_battery_plus"
              options:
                type: custom:multiple-entity-row
                secondary_info:
                  attribute: battery_type_and_quantity
                  name: Type
                entities:
                  - attribute: battery_last_replaced
                    name: Replaced
                    format: relative
                  - attribute: battery_low_threshold
                    name: Threshold
                    unit: "%"
          exclude:
            - state: unavailable
            - state: unknown
        sort:
          method: state
          numeric: true
        show_empty: false
