                    features:
                      - type: cover-open-close
                      - type: cover-position
                  - type: tile
                    entity: number.window_blind_controller_9_default_on_value
                    name: Open Stop Point (Param 4)
                    icon: mdi:blinds-open

              - type: vertical-stack
                cards:
                  - type: tile
                    entity: cover.window_blind_controller_horizontal_slats_angle
                    name: SR Blind 10
                    features:
                      - type: cover-open-close
                      - type: cover-position
                  - type: tile
                    entity: number.window_blind_controller_default_on_value
                    name: Open Stop Point (Param 4)
                    icon: mdi:blinds-open

      # ── South Sunroom — Individual Blinds ─────────────────────
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## South Sunroom — Individual Blinds"
          - type: grid
            columns: 2
            cards:
              - type: vertical-stack
                cards:
                  - type: tile
                    entity: cover.window_blind_controller_1_horizontal_slats_angle
                    name: SR Blind 1
                    features:
                      - type: cover-open-close
                      - type: cover-position
                  - type: tile
                    entity: number.window_blind_controller_1_default_on_value
                    name: Open Stop Point (Param 4)
                    icon: mdi:blinds-open

              - type: vertical-stack
                cards:
                  - type: tile
