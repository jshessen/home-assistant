# iBlinds Dashboard — v2 and v3 Stop Point Controls
#
# Two views: one per generation, cards grouped by room/area.
#
# v2: Template cover entities + input_number helpers (packages/iblinds_v2_covers.yaml)
#     open_cover → stop at configured % (firmware has no native stop parameter).
# v3: Native Z-Wave cover entities (Window Covering CC 106) + Z-Wave Parameter 4
#     "Default ON Value" number entities for the open stop point.
#
# ⚠️  v3 Parameter 4 sliders: number.* entities are disabled by Z-Wave JS by default.
#     Enable each one: Settings → Devices & Services → Z-Wave JS → [device] →
#     enable "Default ON Value" before the slider will respond.
#
# v3 cover group membership (from HA cover groups):
#   North Sunroom  : SR Blinds 9 (node 80), SR Blinds 10 (node 79)
#   South Sunroom  : SR Blinds 1 (node 102), SR Blinds 2 (node 109), SR Blinds 3 (node 87)
#   West Sunroom   : SR Blinds 4 (node 82), SR Blinds 8 (node 81), + Bay Blinds group
#   Bay Blinds     : SR Blinds 5 (node 113), SR Blinds 6 (node 108), SR Blinds 7 (node 125)
#   Patricia's     : SR Blinds 3 (node 87), SR Blinds 4 (node 82)
#   Stella's       : SR Blinds 8 (node 81), SR Blinds 9 (node 80)
#   Hadley's       : SR Blinds 10 (node 79)
#   Kids' Bedroom  : node 105 (standalone)

views:

  # ═══════════════════════════════════════════════════════════════
  # VIEW 1: iBlinds v2
  # Four room blinds. Each card = cover tile + open stop-point slider.
  # Stop points resolve: per-device helper (if > 0) → global fallback.
  # ═══════════════════════════════════════════════════════════════
  - title: v2 Blinds
    path: v2-blinds
    icon: mdi:blinds
    cards:

      # ── Living Room ────────────────────────────────────────────
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Living Room"
          - type: grid
            columns: 2
            cards:
              - type: vertical-stack
                cards:
                  - type: tile
                    entity: cover.window_blind_controller
                    name: Right Blinds
                    features:
                      - type: cover-open-close
                      - type: cover-position
                  - type: tile
                    entity: input_number.iblinds_v2_node71_open_position
                    name: Open Stop Point
                    icon: mdi:blinds-open

              - type: vertical-stack
                cards:
                  - type: tile
                    entity: cover.window_blind_controller_3
                    name: Left Blinds
                    features:
                      - type: cover-open-close
                      - type: cover-position
                  - type: tile
                    entity: input_number.iblinds_v2_node72_open_position
                    name: Open Stop Point
                    icon: mdi:blinds-open

      # ── Guest Room ─────────────────────────────────────────────
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Guest Room"
          - type: tile
            entity: cover.window_blind_controller_2
            name: Guest Blinds
            features:
              - type: cover-open-close
              - type: cover-position
          - type: tile
            entity: input_number.iblinds_v2_node107_open_position
            name: Open Stop Point
            icon: mdi:blinds-open

      # ── Bedroom ────────────────────────────────────────────────
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Bedroom"
          - type: tile
            entity: cover.window_blind_controller_4
            name: Bedroom Blinds
            features:
              - type: cover-open-close
              - type: cover-position
          - type: tile
            entity: input_number.iblinds_v2_node103_open_position
            name: Open Stop Point
            icon: mdi:blinds-open

      # ── Global Default ─────────────────────────────────────────
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Global Default"
          - type: tile
            entity: input_number.iblinds_v2_open_position
            name: Default Open Stop Point (fallback for all v2 blinds)
            icon: mdi:blinds-open


  # ═══════════════════════════════════════════════════════════════
  # VIEW 2: iBlinds v3
  # Sunroom (10 blinds) + Kids' Bedroom (1 blind).
  # Top section: named group controls for quick whole-room commands.
  # Bottom section: individual blinds with Parameter 4 stop-point sliders.
  # ⚠️  Enable number.* entities in HA before sliders respond.
  # ═══════════════════════════════════════════════════════════════
  - title: v3 Blinds
    path: v3-blinds
    icon: mdi:blinds-horizontal
    cards:

      # ── Sunroom — Quick Group Controls ─────────────────────────
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Sunroom — Group Controls"
