# iBlinds Dashboard — v2 and v3 Stop Point Controls
#
# Each blind shows its cover tile + stop-point slider so users can adjust the
# open stop position without navigating to Settings.
#
# v2: Uses template cover entities + input_number helpers (packages/iblinds_v2_covers.yaml)
# v3: Uses native Z-Wave cover entities + Z-Wave Parameter 4 "Default ON Value" number entities
#
# ⚠️  v3 Parameter 4 sliders: The number.* entities below are disabled by the
#     Z-Wave JS integration by default. Enable each one in HA before the slider
#     will respond: Settings → Devices & Services → Z-Wave JS → [device] →
#     enable "Default ON Value".

views:
  - title: Blinds
    path: blinds
    icon: mdi:blinds
    cards:

      # ═══════════════════════════════════════════════════════
      # iBlinds v2 — Room Blinds
      # Stop points controlled via input_number helpers
      # ═══════════════════════════════════════════════════════
      - type: markdown
        content: "## iBlinds v2 — Room Blinds"

      - type: vertical-stack
        title: Right Blinds (Living Room)
        cards:
          - type: tile
            entity: cover.window_blind_controller
            name: Right Blinds
            features:
              - type: cover-open-close
              - type: cover-position
          - type: tile
            entity: input_number.iblinds_v2_node71_open_position
            name: Open Stop Point
            icon: mdi:blinds-open

      - type: vertical-stack
        title: Left Blinds (Living Room)
        cards:
          - type: tile
            entity: cover.window_blind_controller_3
            name: Left Blinds
            features:
              - type: cover-open-close
              - type: cover-position
