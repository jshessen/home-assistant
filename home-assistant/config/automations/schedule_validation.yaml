# Schedule Helper Validation
# Notifies if any active schedule helpers are unconfigured (at 00:00:00)

- id: schedule_helper_validation
  alias: "Schedule Helper Validation"
  description: >-
    Fires on HA start and at 00:01 daily. Warns if any active schedule helpers
    are still at midnight (00:00:00 = HA default for unconfigured input_datetime).
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time
      at: "00:01:00"
  conditions: []
  actions:
    - variables:
        unconfigured_list: >-
          {% set helpers = [
            ('Good Morning Early', 'input_datetime.schedule_good_morning_early'),
            ('Start Active Day (Weekday)', 'input_datetime.schedule_start_active_day_weekday'),
            ('Work Time (Weekday)', 'input_datetime.schedule_work_time_weekday'),
          ] %}
          {% set ns = namespace(items=[]) %}
          {% for label, entity in helpers %}
            {% if states(entity) == '00:00:00' %}
              {% set ns.items = ns.items + ['• ' + label + ' (' + entity + ')'] %}
            {% endif %}
          {% endfor %}
          {{ ns.items | join('\n') }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ unconfigured_list | trim != '' }}"
          sequence:
            - action: persistent_notification.create
              data:
                title: "⚠️ Schedule Helper Not Configured"
                message: >-
                  The following schedule helpers are at midnight (00:00:00) and may
                  cause unexpected automation behavior:

                  {{ unconfigured_list }}

                  Fix via Settings → Helpers or Developer Tools → States.
                notification_id: schedule_helper_warning
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: schedule_helper_warning
