# ============================================================================
# Missouri American Water - Rate Management Package
# ============================================================================
# Automated rate tracking for Missouri American Water (St Louis County)
# ============================================================================

shell_command:
  update_amwater_rates: >-
    python3 /config/packages/amwater/amwater_rate_manager.py --download --parse --dry-run

automation:
  - id: check_amwater_rates_monthly
    alias: "Check MO American Water Rates Monthly"
    description: "Automatically check for updated water rate sheets"
    triggers:
      - platform: time
        at: "03:30:00"
    conditions:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    actions:
      - action: shell_command.update_amwater_rates
      - action: system_log.write
        data:
          message: "MO American Water rate check completed"
          level: info

input_number:
  amwater_mo_stl_monthly_fixed:
    name: "MO American Water STL Monthly Customer Charge"
    unit_of_measurement: "USD"
    min: 0.00
    max: 100.00
    step: 0.01
    icon: mdi:currency-usd
    mode: box
    initial: 11.00

  amwater_mo_stl_rate_per_100_gal:
    name: "MO American Water STL Commodity Rate (per 100 gal)"
    unit_of_measurement: "USD/100gal"
    min: 0.00
    max: 10.00
    step: 0.00001
    icon: mdi:water
    mode: box
    initial: 1.03749
