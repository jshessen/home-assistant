# ============================================================================
# Mode Helper Entities
# ============================================================================
# input_select entities used by mode_management automations and scripts.
# active_holiday is managed via the UI helper — defined here only for the
# entities that have no other include path.
# ============================================================================

input_boolean:
  guest_mode:
    name: Guest Mode
    icon: mdi:account-multiple
    initial: off

  work_from_home_mode:
    name: Work From Home Mode
    icon: mdi:desk
    initial: off

  holiday_decorations_inside:
    name: Holiday Decorations Inside
    icon: mdi:string-lights
    initial: off

  holiday_decorations_outside:
    name: Holiday Decorations Outside
    icon: mdi:pine-tree
    initial: off

  movie_mode:
    name: Movie Mode
    icon: mdi:movie-open
    initial: off

  party_mode:
    name: Party Mode
    icon: mdi:party-popper
    initial: off

  disable_good_morning:
    name: Disable Good Morning
    icon: mdi:alarm-off
    initial: off

  disable_good_night:
    name: Disable Good Night
    icon: mdi:sleep-off
    initial: off

  disable_holiday_schedules:
    name: Disable Holiday Schedules
    icon: mdi:calendar-remove
    initial: off

input_select:
  presence_mode:
    name: Presence Mode
    icon: mdi:home-account
    options:
      - Home
      - Away
      - Vacation
    initial: Home

  time_of_day:
    name: Time of Day
    icon: mdi:clock-outline
    options:
      - Morning
      - Day
      - Evening
      - Night
    initial: Morning

  active_holiday:
    name: Active Holiday
    icon: mdi:calendar-star
    options:
      - No Holiday
      - New Years
      - Valentines Day
      - St. Patrick's Day
      - Easter
      - Cinco de Mayo
      - Memorial Day
      - Independence Day
      - Labor Day
      - Halloween
      - Thanksgiving
      - Christmas
    initial: No Holiday

input_datetime:
  schedule_good_morning_early:
    name: "Schedule: Good Morning (Early)"
    has_time: true
    has_date: false
    icon: mdi:clock-outline

  schedule_start_active_day_weekday:
    name: "Schedule: Start Active Day (Weekday)"
    has_time: true
    has_date: false
    icon: mdi:clock-time-six

  schedule_start_active_day_weekend:
    name: "Schedule: Start Active Day (Weekend)"
    has_time: true
    has_date: false
    icon: mdi:clock-time-eight

  schedule_work_time_weekday:
    name: "Schedule: Work Time (Weekday)"
    has_time: true
    has_date: false
    icon: mdi:briefcase-clock

  schedule_good_night_weekday:
    name: "Schedule: Good Night (Weekday)"
    has_time: true
    has_date: false
    icon: mdi:clock-time-eleven

  schedule_good_night_weekend:
    name: "Schedule: Good Night (Weekend)"
    has_time: true
    has_date: false
    icon: mdi:clock-time-twelve

input_number:
  wake_brightness_weekday:
    name: Wake Brightness (Weekday)
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 5
    icon: mdi:brightness-7
    mode: slider
    initial: 80

  wake_brightness_weekend:
    name: Wake Brightness (Weekend)
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 5
    icon: mdi:brightness-5
    mode: slider
    initial: 50

  wake_color_temp_weekday:
    name: Wake Color Temp (Weekday)
    unit_of_measurement: "mireds"
    min: 153
    max: 500
    step: 10
    icon: mdi:thermometer
    mode: slider
    initial: 370

  wake_color_temp_weekend:
    name: Wake Color Temp (Weekend)
    unit_of_measurement: "mireds"
    min: 153
    max: 500
    step: 10
    icon: mdi:thermometer-low
    mode: slider
    initial: 420

  wake_blinds_delay_min:
    name: Wake Blinds Delay (Minutes)
    unit_of_measurement: "min"
    min: 0
    max: 30
    step: 1
    icon: mdi:timer-outline
    mode: slider
    initial: 5

  wake_kids_lights_delay_min:
    name: Wake Kids Lights Delay (Minutes)
    unit_of_measurement: "min"
    min: 0
    max: 60
    step: 5
    icon: mdi:timer
    mode: slider
    initial: 10

  work_bedroom_blinds_pct:
    name: Work Day Bedroom Blinds Position
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 1
    icon: mdi:blinds
    mode: slider
    initial: 51
