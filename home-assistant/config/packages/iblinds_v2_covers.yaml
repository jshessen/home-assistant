# iBlinds v2 — HA-layer open stop-point via Template Covers
#
# Problem: iBlinds v2 firmware 1.65 has NO "Default ON Value" parameter (unlike v3).
# Calling cover.open_cover drives the blind fully open (100%). This package
# intercepts open commands at the HA layer and substitutes a configurable stop point.
#
# v3 devices handle this natively via Z-Wave Parameter 4 — they do NOT use this package.
#
# Architecture: Template Cover pattern
#   - Physical Z-Wave entities renamed to *_hw suffix (one-time UI step, see below)
#   - Template covers take the original entity IDs — callers see no change
#   - open_cover → translates to set_cover_position at the configured stop point
#   - close_cover / set_cover_position → pass through to the _hw entity unchanged
#   - Intercepts ALL callers: scripts, automations, Alexa, Lovelace — zero script changes
#
# Stop-point resolution (per-device overrides global):
#   1. If iblinds_v2_node{N}_open_position > 0 → use that value for this device only
#   2. If iblinds_v2_node{N}_open_position == 0 (default) → fall back to iblinds_v2_open_position
#   Setting a per-device helper to 0 means "inherit from global."
#
# ─── PREREQUISITE: Rename physical entities in HA UI (one-time) ────────────────
# Settings → Entities → find each entity → Edit (pencil) → change Entity ID:
#
#   cover.window_blind_controller       → cover.window_blind_controller_hw
#   cover.window_blind_controller_2     → cover.window_blind_controller_2_hw
#   cover.window_blind_controller_3     → cover.window_blind_controller_3_hw
#   cover.window_blind_controller_4     → cover.window_blind_controller_4_hw
#
# Nodes 67 and 106 have no cover entities (not in registry — likely need re-inclusion).
# After Z-Wave re-interview identifies them, uncomment the stub entries at the bottom.
# ──────────────────────────────────────────────────────────────────────────────────
#
# Phase 1 (Z-Wave layer, done by Linus):
#   ib2_0.json updated with Lifeline association + treatSetAsReport + Binary Switch removal
#   → Re-interview nodes 67, 71, 72, 103, 106, 107 in Z-Wave JS UI after restart
#
# Phase 2 (HA layer, this file):
#   Template covers provide the stop-point behavior firmware cannot.

input_number:
  # ── Global stop point ──────────────────────────────────────────────────────────
  # Used by any device whose per-device helper is set to 0 (default).
  iblinds_v2_open_position:
    name: "iBlinds v2 Open Position"
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 50
    icon: mdi:blinds-open
    mode: slider

  # ── Per-device stop points ─────────────────────────────────────────────────────
  # Setting a value here (5–100) overrides the global for that specific blind.
  # Leave at 0 (default) to inherit from iblinds_v2_open_position above.
  iblinds_v2_node71_open_position:
    name: "iBlinds v2 Node 71 Open Position (Right Blinds)"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 0
    icon: mdi:blinds-open
    mode: slider

  iblinds_v2_node107_open_position:
    name: "iBlinds v2 Node 107 Open Position (Guest Blinds)"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 0
    icon: mdi:blinds-open
    mode: slider

  iblinds_v2_node72_open_position:
    name: "iBlinds v2 Node 72 Open Position (Left Blinds)"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 0
    icon: mdi:blinds-open
    mode: slider

  iblinds_v2_node103_open_position:
    name: "iBlinds v2 Node 103 Open Position (Bedroom Blinds)"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 0
    icon: mdi:blinds-open
    mode: slider

template:
  - cover:
      # ── Node 71: Right Blinds ───────────────────────────────────────────────────
      - name: "Window Blind Controller"
        unique_id: iblinds_v2_node71
        device_class: blind
        availability: >
          {{ states('cover.window_blind_controller_hw') not in ['unavailable', 'unknown'] }}
        position: >
          {{ state_attr('cover.window_blind_controller_hw', 'current_position') | int(0) }}
        open_cover:
          action: cover.set_cover_position
          target:
            entity_id: cover.window_blind_controller_hw
          data:
            position: >-
              {% set per = states('input_number.iblinds_v2_node71_open_position') | int(0) %}
              {{ per if per > 0 else states('input_number.iblinds_v2_open_position') | int(50) }}
        close_cover:
          action: cover.close_cover
          target:
            entity_id: cover.window_blind_controller_hw
        stop_cover:
          action: cover.stop_cover
          target:
            entity_id: cover.window_blind_controller_hw
        set_cover_position:
          action: cover.set_cover_position
          target:
            entity_id: cover.window_blind_controller_hw
          data:
            position: "{{ position }}"

      # ── Node 107: Guest Blinds ──────────────────────────────────────────────────
